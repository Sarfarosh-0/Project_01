<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Template</title>
    <link rel="stylesheet" href="card.css">
</head>

<body>
    <div class="card">
        <div class="img">
            <img src="https://i.pinimg.com/1200x/af/2b/f1/af2bf1655023e5f07d9db211d3cfe524.jpg" alt="poster">
        </div>
        <div class="gener">
            <span>Action</span>
            <span>Sci-Fi</span>
        </div>
        <h1 class="title">The Avengers</h1>
        <p class="story">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Architecto, maxime? Eum assumenda doloribus cumque
            expedita voluptatem in eos quibusdam. Sequi neque expedita, consectetur nulla repellendus natus corporis
            blanditiis aperiam laudantium.
        </p>
        <div class="details">
            <a class="more" href="/" target="_blank">Know More</a>
        </div>
    </div>
</body>

</html>
